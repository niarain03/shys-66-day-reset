function migrateDay(d,salt=1){d.stats={...emptyStats(),...(d.stats||{})};d.measurements={...emptyMeas(),...(d.measurements||{})};d.bossProgress=d.bossProgress||0;d.social=d.social||{title:pick(socials,d.day,salt,77),status:'todo',awarded:false};d.hobby=d.hobby||{title:pick(hobbies,d.day,salt,63),status:'todo',awarded:false};d.postureLogged=!!d.postureLogged;d.quests=(d.quests||[]).map(q=>({...q,category:q.category||'core'}))}
function save(){state.lastSaved=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));render()}
function addXP(n,msg){const oldLevel=Math.floor(state.xp/100)+1,oldTokens=state.tokensEarned;state.xp=Math.max(0,state.xp+n);if(n>0)state.rewardXp+=n;syncRewards();const newLevel=Math.floor(state.xp/100)+1;if(state.tokensEarned>oldTokens)showToast('Freebie Hunt token unlocked!');else if(newLevel>oldLevel)showToast(`Level ${newLevel} unlocked!`);else if(msg)showToast(msg)}
function removeEarnedXP(n){state.xp=Math.max(0,state.xp-n);state.rewardXp=Math.max(0,state.rewardXp-n);syncRewards()}


function syncRewards(){state.tokensEarned=Math.max(state.tokensEarned||0,Math.floor((state.rewardXp||0)/250));let b=new Set(state.badges);if(state.totalDone>=1)b.add('first');if(state.totalDone>=5)b.add('five');if(state.totalDone>=25)b.add('twentyfive');if(state.streak>=3)b.add('three');if(state.streak>=7)b.add('seven');if(state.xp>=500)b.add('xp500');if(state.bossWins>=1)b.add('boss');if(state.trainingSessions>=3)b.add('run3');if(state.currentDay>=14)b.add('d14');if(state.currentDay>=30)b.add('d30');if(state.days['66']?.finished)b.add('d66');const before=new Set(state.badges);state.badges=[...b];const freshB=state.badges.find(x=>!before.has(x));if(freshB)showToast(`Badge unlocked: ${badgeDefs.find(z=>z[0]===freshB)?.[1]||'New badge'}!`)}
function recentRateFor(s){const ds=Object.values(s.days).filter(d=>d.finished&&d.day<s.currentDay).sort((a,b)=>b.day-a.day).slice(0,7);return ds.length?ds.filter(d=>d.cleared).length/ds.length:0}function tierFor(s){if(s.currentDay<8)return 0;const r=recentRateFor(s);return r>=.85?Math.min(4,Math.floor((s.currentDay-1)/14)+1):r>=.70?Math.min(3,Math.floor((s.currentDay-1)/21)+1):0}function targetsFor(s){const t=tierFor(s);return{water:Math.min(64,24+t*8),stretch:8+t*2,wind:10+t*5,move:30+t*5}}function recentRate(){return recentRateFor(state)}function tier(){return tierFor(state)}function targets(){return targetsFor(state)}
function customApplies(c,day){if(!c.active||day<c.startDay)return false;if(c.frequency==='today')return day===c.startDay;if(c.frequency==='daily')return true;const o=(day-c.startDay)%7;return c.frequency==='3x'?[0,2,5].includes(o):[0,1,3,5].includes(o)}
const GUARANTEED_BOSS_DAYS=[7,14,21,28,35,42,49,56,63,66];
function isGuaranteedBossDay(day){return GUARANTEED_BOSS_DAYS.includes(day)}
function bossFor(day,s=state){const guaranteed=isGuaranteedBossDay(day);if(!guaranteed&&hash(day*41+s.randomSalt)%9!==0)return null;return pick(bossDefs,day,s.randomSalt,91)}
function nextBossEncounter(fromDay=state.currentDay){for(let d=fromDay;d<=66;d++){const b=bossFor(d,state);if(b)return{day:d,boss:b,surprise:!isGuaranteedBossDay(d)}}return null}
function bossIcon(name){return({'Clutter Hydra':'🐉','Scroll Goblin':'👺','Side-Quest Hoarder':'🎒','Procrastination Mimic':'🎭','Couch Boss':'🛋️','Boredom Dragon':'🐲'})[name]||'👾'}
function checks(...labels){return labels.map((label,i)=>({id:String(i),label,done:false}))}
function buildDay(s,day,type='normal'){const t=targetsFor(s);const q=(id,title,detail,xp,required=true,progress=null,frequency='Daily',ck=null,category='core')=>({id,title,detail,xp,required,status:'todo',progress,frequency,checks:ck,category});const quests=[];s.carryover.slice(0,2).forEach((title,i)=>quests.push(q(`carry-${i}`,`Carryover: ${title}`,'This unfinished one-off task came back.',10,true,null,'Carryover',null,'carryover')));quests.push(q('water',`Drink ${t.water} oz plain water`,'Zero-sugar soda and coffee do not count toward the plain-water target.',15,true,{current:0,target:t.water,step:8,unit:'oz'}));quests.push(q('weigh',"Log today's weight",'XP is for logging, never for the number going down. Use the quick weight entry on Today or the Dashboard.',5,true,null,'Daily',null,'tracking'));quests.push(q('food','Build 2 actual meals','Complete all 3 checks: protein with meal 1, protein with meal 2, and fruit/vegetables at least once.',20,true,null,'Daily',checks('Meal 1 includes protein','Meal 2 includes protein','Fruit or vegetables at least once'),'nutrition'));const hChecks=['Brush #1','Brush #2','Floss','AM skincare','PM skincare','Lotion / body care'];if([0,1,3,5].includes((day-1)%7))hChecks.push('Shower / body reset');quests.push(q('hygiene','Hygiene reset','Practical care, not an appearance challenge.',20,true,null,'Daily',checks(...hChecks),'hygiene'));quests.push(q('sleep',`${t.wind}-minute pre-sleep brain-downshift`,'Brain dump, breathing, meditation, or quiet low-stimulation wind-down.',15,true,{current:0,target:t.wind,step:5,unit:'min'},'Daily',null,'sleep'));const m=pick(mental,day,s.randomSalt,11);quests.push(q('mental',m[0],m[1],15,true,null,'Rotating',null,'mental'));quests.push(q('move',`${t.move}+ minutes intentional movement`,'Walk, treadmill, strength, dance, stairs, gym, or another intentional movement block.',20,true,{current:0,target:t.move,step:5,unit:'min',max:120},'Daily',null,'movement'));quests.push(q('stretch',`Stretch or mobility for ${t.stretch} minutes`,'Mobility progression.',15,true,{current:0,target:t.stretch,step:2,unit:'min',max:60},'Daily',null,'mobility'));const recent=Object.values(s.days).filter(d=>d.day<day).sort((a,b)=>b.day-a.day).slice(0,2).flatMap(d=>d.quests.filter(x=>x.category==='cleaning').map(x=>x.title));const pool=cleaning.filter(x=>!recent.includes(x[0]));const h=pick(pool.length?pool:cleaning,day,s.randomSalt,29);quests.push(q('home',h[0],h[1],10,true,null,'Rotating',null,'cleaning'));if(type==='assignment')quests.push(q('school','Do one 30-minute school block at least 6 hours before the 3 AM deadline','Break the last-few-hours habit.',25,true,{current:0,target:30,step:5,unit:'min',max:90},'Assignment day',null,'school'));if(type==='study')quests.push(q('study','25-minute reading/study block','Study before pressure kicks in.',20,true,{current:0,target:25,step:5,unit:'min',max:90},'Study day',null,'school'));if(type==='career')quests.push(q('career',pick(career,day,s.randomSalt,53),'Career progress.',20,true,null,'Career day',null,'career'));if(type==='busy')quests.push(q('busy-side','Do one habit while you are already out','Attach one useful habit to whatever plans you already have today.',15,false,null,'Busy-day bonus',null,'bonus'));const boss=bossFor(day,s);if(boss?.[0]==='Procrastination Mimic'&&!['assignment','study','career'].includes(type))quests.push(q('admin-early','Start one admin task before pressure time','Pick one real-life admin task and start it earlier than usual.',15,false,null,'Boss support',null,'bonus'));const bc=boss?.[0]==='Side-Quest Hoarder'?3:2+(hash(day+s.randomSalt)%2);const used=new Set();for(let i=0;i<bc;i++){let title=pick(bonuses,day,s.randomSalt,101+i*17);while(used.has(title))title=bonuses[(bonuses.indexOf(title)+1)%bonuses.length];used.add(title);quests.push(q(`bonus-${i}`,title,'Optional randomized bonus quest.',i===0?15:20,false,null,'Bonus',null,'bonus'))}if(hash(day*3+s.randomSalt)%4===0)quests.push(q('phone-bonus','30-minute phone-free replacement block','Replace scrolling with another activity. No hard daily screen-time cap.',15,false,{current:0,target:30,step:5,unit:'min',max:90},'Bonus',null,'bonus'));s.custom.filter(c=>customApplies(c,day)).forEach(c=>quests.push({id:c.id,title:c.title,detail:'Custom quest',xp:c.xp,required:false,status:'todo',frequency:c.frequency,category:'custom'}));return{day,dayType:type,quests,finished:false,cleared:false,clearPct:0,stats:emptyStats(),measurements:emptyMeas(),trainingLogged:false,trainingResult:null,trainingStageAtLog:null,bossDone:false,bossProgress:0,bossName:null,social:{title:pick(socials,day,s.randomSalt,77),status:'todo',awarded:false},hobby:{title:pick(hobbies,day,s.randomSalt,63),status:'todo',awarded:false},postureLogged:false,mystery:{revealed:false,completed:false,title:pick(bonuses,day,s.randomSalt,777),xp:20},recap:null}}
function day(){return state.days[String(state.viewedDay)]}function editable(){return state.viewedDay===state.currentDay&&!day().finished}function quest(id){return day().quests.find(q=>q.id===id)}
function applySkipPenalty(q){const p=Math.min(5,state.xp);state.xp-=p;q.skipPenalty=p}function refundSkipPenalty(q){const p=q.skipPenalty||0;state.xp+=p;q.skipPenalty=0}
function completeQuest(id){if(!editable())return;const q=quest(id);if(!q||q.status==='done'||id==='weigh')return;if(q.status==='skipped')refundSkipPenalty(q);q.status='done';if(q.progress)q.progress.current=Math.max(q.progress.current,q.progress.target);if(q.checks)q.checks.forEach(c=>c.done=true);state.totalDone++;addXP(q.xp,pick(['Quest cleared. Nice.','XP acquired. Keep cooking.','That counts. Stack another.','Tiny win secured.'],state.currentDay,state.randomSalt,state.totalDone));save()}
function skipQuest(id){if(!editable())return;const q=quest(id);if(!q||q.status==='skipped')return;if(q.status==='done'){removeEarnedXP(q.xp);state.totalDone=Math.max(0,state.totalDone-1)}q.status='skipped';applySkipPenalty(q);save()}
function undoQuest(id){if(!editable())return;const q=quest(id);if(!q||q.status==='todo'||id==='weigh')return;if(q.status==='done'){removeEarnedXP(q.xp);state.totalDone=Math.max(0,state.totalDone-1)}if(q.status==='skipped')refundSkipPenalty(q);q.status='todo';if(q.progress)q.progress.current=0;if(q.checks)q.checks.forEach(c=>c.done=false);save()}
function adjust(id,delta){if(!editable())return;const q=quest(id);if(!q?.progress)return;const was=q.status==='done',wasSkip=q.status==='skipped';const max=q.progress.max||q.progress.target;q.progress.current=Math.max(0,Math.min(max,q.progress.current+delta));const now=q.progress.current>=q.progress.target;if(now&&!was){if(wasSkip)refundSkipPenalty(q);q.status='done';state.totalDone++;addXP(q.xp,'Progress target cleared!')}else if(!now&&was){q.status='todo';removeEarnedXP(q.xp);state.totalDone=Math.max(0,state.totalDone-1)}save()}


function toggleCheck(id,cid){if(!editable())return;const q=quest(id),c=q?.checks?.find(x=>x.id===cid);if(!c)return;const was=q.status==='done',wasSkip=q.status==='skipped';c.done=!c.done;const now=q.checks.every(x=>x.done);if(now&&!was){if(wasSkip)refundSkipPenalty(q);q.status='done';state.totalDone++;addXP(q.xp,'Checklist cleared!')}else if(!now&&was){q.status='todo';removeEarnedXP(q.xp);state.totalDone=Math.max(0,state.totalDone-1)}save()}
function logWeightQuick(){if(!editable())return;const el=document.getElementById('quickWeight');const v=el?.value.trim();if(!v)return showToast('Enter your weight first.');const d=day(),first=!d.stats.saved;d.stats.weight=v;d.stats.saved=true;const q=quest('weigh');if(q&&q.status!=='done'){if(q.status==='skipped')refundSkipPenalty(q);q.status='done';state.totalDone++;addXP(q.xp,'Daily weigh-in logged +5 XP')}save()}
function saveStats(){if(!editable())return;const d=day();const weight=document.getElementById('stWeight').value.trim();if(!weight)return showToast('Weight is required for the daily log.');const first=!d.stats.saved;d.stats={weight,steps:val('stSteps'),distance:val('stDistance'),water:val('stWater'),mood:val('stMood'),bedtime:val('stBed'),wake:val('stWake'),sleepQuality:val('stSleepQ'),saved:true};const q=quest('weigh');if(first&&q&&q.status!=='done'){if(q.status==='skipped')refundSkipPenalty(q);q.status='done';state.totalDone++;addXP(q.xp,'Daily weight/stats logged +5 XP')}else showToast(first?'Daily log saved.':'Daily log updated.');save()}
function saveMeasurements(){if(!editable())return;const d=day(),first=!d.measurements.saved;d.measurements={waist:val('mWaist'),hip:val('mHip'),chest:val('mChest'),thigh:val('mThigh'),saved:true};if(first)addXP(15,'Measurement check-in saved +15 XP');else showToast('Measurements updated.');save()}
function setDayType(type){if(!editable())return;const old=day(),fresh=buildDay(state,state.currentDay,type);fresh.quests.forEach(n=>{const o=old.quests.find(x=>x.id===n.id);if(o){n.status=o.status;n.progress=o.progress;n.checks=o.checks}});fresh.stats=old.stats;fresh.measurements=old.measurements;fresh.trainingLogged=old.trainingLogged;fresh.trainingResult=old.trainingResult;fresh.trainingStageAtLog=old.trainingStageAtLog;fresh.bossDone=old.bossDone;fresh.bossProgress=old.bossProgress;fresh.social=old.social;fresh.hobby=old.hobby;fresh.postureLogged=old.postureLogged;fresh.recap=old.recap;state.days[String(state.currentDay)]=fresh;save()}
function trainingLog(kind){if(!editable()||day().trainingLogged)return;const d=day();d.trainingLogged=true;d.trainingResult=kind;d.trainingStageAtLog=state.trainingStage;state.trainingSessions++;if(kind==='manageable'){state.trainingSuccesses++;if(state.trainingSuccesses>=2&&state.trainingStage<training.length){state.trainingStage++;state.trainingSuccesses=0;showToast(`Turkey Trot stage advanced to ${state.trainingStage}!`)}}else if(kind==='hard')state.trainingSuccesses=0;const mv=quest('move');if(mv&&mv.status!=='done'){mv.status='done';mv.progress.current=Math.max(mv.progress.current,mv.progress.target);state.totalDone++;addXP(mv.xp)}addXP(10,'Training logged +10 XP');save()}
function postureLog(){if(!editable()||day().postureLogged)return;day().postureLogged=true;state.postureSessions++;addXP(10,'Posture side quest +10 XP');save()}
function bossStatus(){const b=bossFor(day().day);if(!b)return null;let cur=day().bossProgress;const kind=b[2],target=b[3];if(kind==='bonus')cur=day().quests.filter(q=>q.category==='bonus'&&q.status==='done').length;if(kind==='admin')cur=day().quests.filter(q=>['school','study','career','admin-early'].includes(q.id)&&q.status==='done').length;if(kind==='move')cur=quest('move')?.progress?.current||0;if(kind==='proof')cur=day().quests.some(q=>q.required&&q.status==='done')?1:0;return{def:b,current:cur,target,ready:cur>=target}}
function bossAdjust(delta){if(!editable())return;const st=bossStatus();if(!st||day().bossDone)return;day().bossProgress=Math.max(0,Math.min(st.target,day().bossProgress+delta));save()}
function defeatBoss(){if(!editable())return;const st=bossStatus();if(!st||!st.ready||day().bossDone)return;day().bossDone=true;day().bossName=st.def[0];state.bossWins++;addXP(50,`BOSS DEFEATED: ${st.def[0]} · +50 XP!`);openBossVictory(st.def[0]);save()}
function openBossVictory(name){setTimeout(()=>openModal(`<div class="bossVictory"><div class="bossVictoryIcon">${bossIcon(name)}</div><span class="kicker">Boss defeated</span><h2>${esc(name)}</h2><div class="victoryXp">+50 XP</div><p class="muted small">You beat today's optional boss. Bosses never affect your daily clear percentage.</p><button class="btn primary full" onclick="closeModal()">Collect victory</button></div>`),30)}
function revealMystery(){if(!editable())return;const m=day().mystery||(day().mystery={revealed:false,completed:false,title:pick(bonuses,day().day,state.randomSalt,777),xp:20});if(m.revealed)return;m.revealed=true;showToast('Mystery quest revealed!');save()}
function completeMystery(){if(!editable())return;const m=day().mystery;if(!m||!m.revealed||m.completed)return;m.completed=true;state.totalDone++;addXP(m.xp,'Mystery quest cleared +20 XP!');save()}
function sideAction(which,action){if(!editable())return;const obj=day()[which];if(action==='complete'){if(obj.status==='done')return;obj.status='done';if(!obj.awarded){obj.awarded=true;state.totalDone++;addXP(15,`${which==='social'?'Social':'Hobby'} side quest +15 XP`)}}else if(action==='skip'){if(obj.status==='done'&&obj.awarded){removeEarnedXP(15);state.totalDone=Math.max(0,state.totalDone-1);obj.awarded=false}obj.status='skipped'}else if(action==='reroll'&&obj.status==='todo'){const pool=which==='social'?socials:hobbies;const idx=pool.indexOf(obj.title);obj.title=pool[(idx+1+hash(state.currentDay+state.randomSalt+(which==='social'?0:17))%3)%pool.length]}save()}
function finishDay(){if(!editable())return;const d=day(),req=d.quests.filter(q=>q.required),done=req.filter(q=>q.status==='done').length,pct=req.length?done/req.length:0;d.finished=true;d.clearPct=pct;d.cleared=pct>=.7;const carry=d.quests.filter(q=>q.required&&q.status!=='done'&&!CORE_DAILY.has(q.id)).map(q=>q.title).slice(0,2);state.carryover=carry;if(d.cleared){state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);addXP(25,'Day cleared. Streak protected +25 XP!')}else{state.streak=0;showToast('Day closed. No restart required — tomorrow is the next round.')}syncRewards();const earned=d.quests.filter(q=>q.status==='done').reduce((n,q)=>n+q.xp,0)+(d.measurements.saved?15:0)+(d.trainingLogged?10:0)+(d.bossDone?50:0)+(d.social.awarded?15:0)+(d.hobby.awarded?15:0)+(d.postureLogged?10:0)+(d.cleared?25:0);d.recap={xpEarned:earned,requiredDone:done,requiredTotal:req.length,bonusDone:d.quests.filter(q=>!q.required&&q.status==='done').length,clearPct:Math.round(pct*100),cleared:d.cleared,carryover:carry,message:d.cleared?'You did enough. That is the point.':'No restart required. Tomorrow is just the next round.'};if(state.currentDay%7===0)state.adaptation.push({day:state.currentDay,tier:tier(),clearRate:recentRate(),reason:tier()>0?'Recent completion supports a gentle increase.':'Targets held steady because consistency matters more than escalation.'});if(state.currentDay<66){state.currentDay++;state.viewedDay=state.currentDay;if(!state.days[String(state.currentDay)])state.days[String(state.currentDay)]=buildDay(state,state.currentDay,'normal')}save()}
function viewDay(delta){const n=Math.max(1,Math.min(state.currentDay,state.viewedDay+delta));state.viewedDay=n;save()}
function weekly(){const ds=Object.values(state.days).filter(d=>d.finished).sort((a,b)=>b.day-a.day).slice(0,7),req=ds.reduce((n,d)=>n+d.quests.filter(q=>q.required).length,0),done=ds.reduce((n,d)=>n+d.quests.filter(q=>q.required&&q.status==='done').length,0),moods=ds.map(d=>+d.stats.mood).filter(Boolean);return{days:ds.length,clear:ds.filter(d=>d.cleared).length,completion:req?Math.round(done/req*100):0,avgMood:moods.length?(moods.reduce((a,b)=>a+b,0)/moods.length).toFixed(1):'—'}}
function sleepShift(){const logs=Object.values(state.days).filter(d=>d.stats.saved&&d.stats.bedtime).sort((a,b)=>b.day-a.day).slice(0,3);if(logs.length<3)return{n:logs.length,text:'Log bedtime for 3 days first. Then the app will start giving a gentle 15-minute earlier nudge.'};const mins=logs.map(d=>timeToMinutes(d.stats.bedtime)),avg=Math.round(mins.reduce((a,b)=>a+b,0)/mins.length),target=(avg-15+1440)%1440;return{n:logs.length,text:`Your recent bedtime baseline is about ${minutesToTime(avg)}. Try starting wind-down around ${minutesToTime(target)}. Do not force an early wake if you are sleep-deprived.`}}
function timeToMinutes(s){if(!s)return 0;let[h,m]=s.split(':').map(Number);return h*60+m}function minutesToTime(m){let h=Math.floor(m/60)%24,min=m%60,amp=h>=12?'PM':'AM',hh=h%12||12;return `${hh}:${String(min).padStart(2,'0')} ${amp}`}
function claimReward(){const available=state.tokensEarned-state.tokensClaimed;if(available<=0)return;state.tokensClaimed++;const [title,description]=pick(rewardIdeas,state.currentDay,state.randomSalt,state.tokensClaimed*19);state.rewards.unshift({id:'r'+Date.now(),day:state.currentDay,title,description,claimedAt:new Date().toISOString(),note:''});showToast(`Reward unlocked: ${title}`);save()}
function saveRewardNote(id){const r=state.rewards.find(x=>x.id===id),el=document.getElementById('rewardNote-'+id);if(r&&el){r.note=el.value;save()}}


function addCustomFromModal(editId=null){const title=val('cTitle').trim(),freq=val('cFreq'),xp=+val('cXp');if(!title)return;if(editId){const c=state.custom.find(x=>x.id===editId);if(c){c.title=title;c.frequency=freq;c.xp=xp;Object.values(state.days).forEach(d=>{const q=d.quests.find(q=>q.id===editId&&q.status==='todo');if(q){q.title=title;q.frequency=freq;q.xp=xp}})}}else{const c={id:'custom-'+Date.now(),title,xp,frequency:freq,startDay:state.currentDay,active:true};state.custom.push(c);if(customApplies(c,state.currentDay))day().quests.push({id:c.id,title,detail:'Custom quest',xp,required:false,status:'todo',frequency:freq,category:'custom'})}closeModal();save()}
function deleteCustom(id){const c=state.custom.find(x=>x.id===id);if(c)c.active=false;Object.values(state.days).forEach(d=>{d.quests=d.quests.filter(q=>q.id!==id||q.status==='done')});save()}
function rerollBonus(id){if(!editable())return;const q=quest(id);if(!q||q.status!=='todo'||q.category!=='bonus')return;let title=pick(bonuses,state.currentDay,state.randomSalt,Date.now()%997);q.title=title;save()}
function val(id){return document.getElementById(id)?.value||''}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}

function renderQuest(q){const e=editable(),done=q.status==='done',sk=q.status==='skipped',tracking=q.id==='weigh';return `<div class="quest ${done?'done':''} ${sk?'skipped':''}"><button class="qcheck ${done?'done':''}" ${!e||tracking?'disabled':''} onclick="${done?`undoQuest('${q.id}')`:`completeQuest('${q.id}')`}">${done?'✓':''}</button><div class="qbody"><div class="qtop"><div><div class="qtitle">${esc(q.title)}</div><div class="qmeta">${esc(q.frequency)} · +${q.xp} XP · ${q.required?'Required':'Optional'}</div></div><button class="morebtn" onclick="questModal('${q.id}')">•••</button></div>${q.progress?`<div class="amountrow"><button class="smallbtn" ${!e?'disabled':''} onclick="adjust('${q.id}',-${q.progress.step})">−</button><div><div class="amounttxt">${q.progress.current}/${q.progress.target} ${esc(q.progress.unit)}</div><div class="bar"><i style="width:${Math.min(100,q.progress.current/q.progress.target*100)}%"></i></div></div><button class="smallbtn" ${!e?'disabled':''} onclick="adjust('${q.id}',${q.progress.step})">+</button></div>`:''}${q.checks?`<div class="checklist">${q.checks.map(c=>`<label class="checkline"><input type="checkbox" ${c.done?'checked':''} ${!e?'disabled':''} onchange="toggleCheck('${q.id}','${c.id}')"><span>${esc(c.label)}</span></label>`).join('')}</div>`:''}${tracking&&q.status!=='done'&&e?`<div class="amountrow" style="grid-template-columns:1fr auto"><input id="quickWeight" class="input" type="number" step="0.1" placeholder="Weight"><button class="btn cream" onclick="logWeightQuick()">Log +5</button></div>`:''}</div></div>`}


function renderToday(){const d=day(),todos=d.quests.filter(q=>q.status==='todo'),done=d.quests.filter(q=>q.status==='done'),skipped=d.quests.filter(q=>q.status==='skipped'),vis=taskTab==='todo'?todos:taskTab==='done'?done:skipped,req=d.quests.filter(q=>q.required),reqDone=req.filter(q=>q.status==='done').length,pct=req.length?Math.round(reqDone/req.length*100):0,available=Math.max(0,state.tokensEarned-state.tokensClaimed),last=state.days[String(state.currentDay-1)],enc=nextBossEncounter(d.day),m=d.mystery||(d.mystery={revealed:false,completed:false,title:pick(bonuses,d.day,state.randomSalt,777),xp:20});return `<div class="topstats"><div class="statbox"><div class="ico">🔥</div><b>${state.streak}</b><span>streak</span></div><div class="statbox"><div class="ico">🏆</div><b>${state.badges.length}</b><span>badges</span></div><div class="statbox"><div class="ico">🎁</div><b>${available}</b><span>rewards</span></div></div><div class="levelrow"><span>Level ${Math.floor(state.xp/100)+1}</span><span>${state.xp} XP</span></div><div class="bar"><i style="width:${state.xp%100}%"></i></div><div class="dayhead"><button class="iconbtn" ${d.day<=1?'disabled':''} onclick="viewDay(-1)">‹</button><div class="center"><div class="label">DAY</div><h1>${d.day}<small>/66</small></h1><em>${d.day===state.currentDay?'CURRENT':'HISTORY'}</em></div><button class="iconbtn" ${d.day>=state.currentDay?'disabled':''} onclick="viewDay(1)">›</button></div>${d.recap?`<div class="recap"><span>${d.recap.cleared?'DAY CLEARED':'DAY CLOSED'}</span><h2>${d.recap.clearPct}% · +${d.recap.xpEarned} XP</h2><p class="muted small">${esc(d.recap.message)}</p><div class="small">${d.recap.requiredDone}/${d.recap.requiredTotal} required · ${d.recap.bonusDone} bonuses · ${d.recap.carryover.length} carryovers</div></div>`:''}${d.day===state.currentDay&&last?.recap?`<div class="notice small"><b>Yesterday:</b> ${last.recap.clearPct}% · ${last.recap.cleared?'cleared':'closed'} · ${last.recap.carryover.length?last.recap.carryo function renderGrowth(){const t=targets(),sl=sleepShift(),hist=Object.values(state.days).filter(d=>d.trainingLogged).sort((a,b)=>b.day-a.day).slice(0,6),bs=bossStatus(),next=nextBossEncounter(day().day);return `<h1 class="pageTitle">GROWTH</h1><div class="bossArenaHeader"><div><span class="kicker">BOSS ARENA</span><h2>${bs?esc(bs.def[0]):next?`Next: ${esc(next.boss[0])}`:'Arena cleared'}</h2></div><div class="arenaIcon">${bs?bossIcon(bs.def[0]):next?bossIcon(next.boss[0]):'🏆'}</div></div>${bs?`<div class="bossArena activeBoss"><div class="bossPortrait">${bossIcon(bs.def[0])}</div><div class="bossTag">${isGuaranteedBossDay(day().day)?'MILESTONE BOSS':'SURPRISE BOSS'}</div><h2>${esc(bs.def[0])}</h2><p>${esc(bs.def[1])}</p><div class="healthLabel"><span>Boss HP</span><b>${Math.max(0,bs.target-bs.current)}/${bs.target}</b></div><div class="bossHealth"><i style="width:${Math.max(0,100-(bs.current/bs.target*100))}%"></i></div><div class="amounttxt">Your progress: ${bs.current}/${bs.target} ${bs.def[2]==='minutes'?'min':bs.def[2]==='zones'?'zones':''}</div>${bs.def[2]==='zones'?`<div class="btnrow"><button class="smallbtn" onclick="bossAdjust(-1)">−</button><button class="btn" onclick="bossAdjust(1)">+ Zone hit</button></div>`:''}${bs.def[2]==='minutes'?`<div class="btnrow"><button class="smallbtn" onclick="bossAdjust(-10)">−</button><button class="btn" onclick="bossAdjust(10)">+ 10 min hit</button></div>`:''}<button class="btn primary full bossFight" ${!editable()||day().bossDone||!bs.ready?'disabled':''} onclick="defeatBoss()">${day().bossDone?'VICTORY ✓':bs.ready?'FINISH BOSS · +50 XP':'Keep attacking the requirement'}</button><p class="muted small">Bosses are optional and never affect your daily completion percentage.</p></div>`:`<div class="bossArena lockedBoss"><div class="bossPortrait">${next?bossIcon(next.boss[0]):'🏆'}</div><div class="bossTag">ARENA LOCKED</div><h2>${next?esc(next.boss[0]):'All bosses cleared'}</h2><p>${next?`Next encounter unlocks on Day ${next.d function trend(label,vals,suffix=''){vals=vals.map(Number).filter(x=>Number.isFinite(x)&&x!==0);if(!vals.length)return `<div class="trend trendempty"><b>${esc(label)}</b><span>No data yet</span></div>`;const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,pts=vals.map((v,i)=>`${vals.length===1?50:i/(vals.length-1)*100},${36-(v-min)/range*30}`).join(' ');return `<div class="trend"><div class="trendhead"><b>${esc(label)}</b><span>${vals.at(-1)}${esc(suffix)}</span></div><svg viewBox="0 0 100 40" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2.6"/></svg></div>`}

nd('Distance',logs.map(x=>x.stats.distance),' mi')}${trend('Water',logs.map(x=>x.stats.water),' oz')}${trend('Mood',logs.map(x=>x.stats.mood))}${trend('XP earned / day',fh.map(x=>x.recap?.xpEarned||0))}${trend('Waist',mh.map(x=>x.measurements.waist),' cm')}</div></div><div class="panel"><h2>Daily tracking</h2><div class="formgrid"><label class="field">Weight<input class="input" id="stWeight" type="number" step="0.1" value="${esc(d.stats.weight)}"></label><label class="field">Steps<input class="input" id="stSteps" type="number" value="${esc(d.stats.steps)}"></label><label class="field">Distance (miles)<input class="input" id="stDistance" type="number" step="0.1" value="${esc(d.stats.distance)}"></label><label class="field">Water oz<input class="input" id="stWater" type="number" value="${esc(d.stats.water)}"></label><label class="field">Mood 1–10<input class="input" id="stMood" type="number" min="1" max="10" value="${esc(d.stats.mood)}"></label><label class="field">Bedtime<input class="input" id="stBed" type="time" value="${esc(d.stats.bedtime)}"></label><label class="field">Wake time<input class="input" id="stWake" type="time" value="${esc(d.stats.wake)}"></label><label class="field">Sleep quality 1–5<input class="input" id="stSleepQ" type="number" min="1" max="5" value="${esc(d.stats.sleepQuality)}"></label></div><p class="muted small">Weight is the required daily log. The others are optional but useful for trends. You can edit saved values later without earning XP twice.</p><button class="btn primary" ${!editable()?'disabled':''} onclick="saveStats()">${d.stats.saved?'Update daily log':'Save daily log +5 XP'}</button></div>${milestone?`<div class="panel"><h2>Measurement check-in</h2><div class="formgrid"><label class="field">Waist (cm)<input class="input" id="mWaist" type="number" step="0.1" value="${esc(d.measurements.waist)}"></label><label class="field">Hip (cm)<input class="input" id="mHip" type="number" step="0.1" value="${esc(d.measurements.hip)}"></label><label class="field">Chest (cm)<input class="input" id="mChest" type="number" step="0.1" value="${esc(d.measurements.chest)}"></label><label class="field">Thigh (cm)<input class="input" id="mThigh" type="number" step="0.1" value="${esc(d.measurements.thigh)}"></label></div><button class="btn" ${!editable()?'disabled':''} onclick="saveMeasurements()">${d.measurements.saved?'Update measurements':'Save +15 XP'}</button><div class="history">${mh.map(x=>`<div class="hrow"><b>Day ${x.day}</b><span>W ${x.measurements.waist||'—'} · H ${x.measurements.hip||'—'} · C ${x.measurements.chest||'—'} · T ${x.measurements.thigh||'—'}</span></div>`).join('')}</div></div><div class="panel"><span class="kicker">Optional</span><h2>Progress photo</h2><p class="muted small">Never part of your daily clear. Photos are kept in this browser using IndexedDB and included in JSON backups.</p><div id="photoPreview"></div><button class="btn" ${!editable()?'disabled':''} onclick="document.getElementById('photoInput').click()">📷 Choose / replace photo</button><input class="hidden" id="photoInput" type="file" accept="image/*" onchange="handlePhoto(this.files[0])"></div>`:''}<div class="panel"><h2>Log history</h2><div class="history">${logs.length?logs.slice().reverse().map(x=>`<div class="hrow"><b>Day ${x.day}</b><span>${x.stats.weight||'—'} lb · ${x.stats.steps||'—'} steps · ${x.stats.distance||'—'} mi · ${x.stats.water||'—'} oz · mood ${x.stats.mood||'—'} · sleep ${x.stats.sleepQuality||'—'}/5</span></div>`).join(''):'<p class="muted small">No saved daily logs yet.</p>'}</div></div>`}
function renderRewards(){const available=Math.max(0,state.tokensEarned-state.tokensClaimed);return `<h1 class="pageTitle">REWARDS</h1><div class="panel"><span class="kicker">Freebie Hunts</span><h2>${available} available</h2><p class="muted small">Every 250 reward XP earns a token. Penalty XP never takes an earned token away.</p><div class="bar"><i style="width:${Math.min(100,(state.rewardXp%250)/250*100)}%"></i></div><p class="muted small">${state.rewardXp%250}/250 reward XP toward the next token.</p><button class="btn primary" ${available<=0?'disabled':''} onclick="claimReward()">Reveal a reward</button><button class="btn ghost" onclick="copyFreebiePrompt()">Copy Freebie Hunt prompt</button></div>${state.rewards.length?`<div class="panel"><h2>Reward inventory</h2>${state.rewards.map(r=>`<div class="reward"><div class="ri">🎁</div><div><b>${esc(r.title)}</b><p class="muted small">${esc(r.description)}</p><span class="muted small">Unlocked Day ${r.day} · ${new Date(r.claimedAt).toLocaleDateString()}</span><input class="input" id="rewardNote-${r.id}" placeholder="Paste what you used it for" value="${esc(r.note)}" onblur="saveRewardNote('${r.id}')"></div></div>`).join('')}</div>`:''}<div class="panel"><h2>Milestone roadmap</h2><div class="history">${[['250 XP','Freebie Hunt token'],['500 XP','XP Hoarder badge'],['Day 7','Weekly boss + weekly summary'],['Day 14','Two-Week Reset badge + measurements'],['Day 30','Thirty-Day Monster badge + boss'],['Day 66','Reset Complete badge']].map(x=>`<div class="hrow"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div><div class="badges">${badgeDefs.map(b=>`<div class="badge ${state.badges.includes(b[0])?'':'locked'}"><div class="bi">🏆</div><b>${esc(b[1])}</b><span>${esc(b[2])}</span></div>`).join('')}</div>`}


function renderMore(){const d=day();return `<h1 class="pageTitle">MORE</h1><div class="panel"><span class="kicker">Social side quest</span><div class="sidecard"><div class="status">${d.social.status}</div><h3>${esc(d.social.title)}</h3><p class="muted small">Optional, free-only, never counted against daily clear. +15 XP if completed.</p><div class="btnrow"><button class="btn primary" ${!editable()||d.social.status==='done'?'disabled':''} onclick="sideAction('social','complete')">${d.social.status==='done'?'Completed ✓':'Complete +15'}</button><button class="btn" ${!editable()||d.social.status!=='todo'?'disabled':''} onclick="sideAction('social','reroll')">Reroll</button><button class="btn ghost" ${!editable()?'disabled':''} onclick="sideAction('social','skip')">Skip</button></div></div></div><div class="panel"><span class="kicker">Hobby side quest</span><div class="sidecard"><div class="status">${d.hobby.status}</div><h3>${esc(d.hobby.title)}</h3><p class="muted small">Optional and meant to gently expand life beyond gaming. +15 XP if completed.</p><div class="btnrow"><button class="btn primary" ${!editable()||d.hobby.status==='done'?'disabled':''} onclick="sideAction('hobby','complete')">${d.hobby.status==='done'?'Completed ✓':'Complete +15'}</button><button class="btn" ${!editable()||d.hobby.status!=='todo'?'disabled':''} onclick="sideAction('hobby','reroll')">Reroll</button><button class="btn ghost" ${!editable()?'disabled':''} onclick="sideAction('hobby','skip')">Skip</button></div></div></div><div class="panel"><h2>Day type</h2><select class="select" ${!editable()?'disabled':''} onchange="setDayType(this.value)"><option value="normal" ${d.dayType==='normal'?'selected':''}>Normal / no major plans</option><option value="busy" ${d.dayType==='busy'?'selected':''}>Busy / plans</option><option value="assignment" ${d.dayType==='assignment'?'selected':''}>Assignment due</option><option value="study" ${d.dayType==='study'?'selected':''}>Reading / studying</option><option value="career" ${d.dayType==='career'?'selected':''}>Job-search heavy</option></select><p class="muted small">Busy days keep the full challenge but add a portable bonus. School/career types add only the relevant task.</p></div><div class="panel"><h2>Custom quests</h2><button class="btn primary" onclick="customModal()">＋ Add custom quest</button><div class="history">${state.custom.filter(c=>c.active).map(c=>`<div class="customrow"><div><b>${esc(c.title)}</b><span>${esc(c.frequency)} · ${c.xp} XP</span></div><div class="actions"><button class="smallbtn" onclick="customModal('${c.id}')">✎</button><button class="smallbtn" onclick="deleteCustom('${c.id}')">🗑</button></div></div>`).join('')||'<p class="muted small">No custom quests yet.</p>'}</div></div><div class="panel"><h2>Data & backup</h2><p class="muted small">Your progress saves after every tap in this browser. Export a backup before clearing browser data or changing devices.</p><span class="savebadge">Last saved: ${state.lastSaved?new Date(state.lastSaved).toLocaleString():'Not yet'}</span><div class="btnrow" style="margin-top:10px"><button class="btn" onclick="exportBackup()">⬇ Export JSON</button><button class="btn" onclick="document.getElementById('backupInput').click()">⬆ Import JSON</button></div><input id="backupInput" class="hidden" type="file" accept="application/json" onchange="importBackup(this.files[0])"><button id="installBtn" class="btn cream full install ${installPrompt?'':'hidden'}" onclick="installApp()">Add to Home Screen</button></div><div class="panel"><h2>Reset everything</h2><p class="muted small">This permanently clears your 66-day progress on this browser.</p><button class="btn danger" onclick="resetModal()">Reset all data</button></div>`}
function render(){syncRewards();document.getElementById('app').innerHTML=section==='today'?renderToday():section==='growth'?renderGrowth():section==='dashboard'?renderDashboard():section==='rewards'?renderRewards():renderMore();document.getElementById('nav').innerHTML=[['today','☀','Today'],['growth','🌱','Growth'],['dashboard','▦','Dashboard'],['rewards','🛡','Rewards'],['more','👥','More']].map(n=>`<button class="navbtn ${section===n[0]?'active':''}" onclick="section='${n[0]}';render()"><div class="nicon">${n[1]}</div><span>${n[2]}</span></button>`).join('');if(section==='dashboard'&&[1,14,28,42,56,66].includes(day().day))loadPhotoPreview(day().day)}
async function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('shy66_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function idbSet(k,v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}async function idbGet(k){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}async function resizePhoto(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onerror=()=>rej(rd.error);rd.onload=()=>{const im=new Image();im.onerror=()=>rej('bad image');im.onload=()=>{const max=720,sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.src=rd.result};rd.readAsDataURL(file)})}async function handlePhoto(file){if(!file)return;const data=await resizePhoto(file);await idbSet('day-'+day().day,data);day().photoSaved=true;save();showToast('Progress photo saved locally.')}async function loadPhotoPreview(n){const data=await idbGet('day-'+n),box=document.getElementById('photoPreview');if(box)box.innerHTML=data?`<img class="progressPhoto" src="${data}" alt="Progress photo day ${n}">`:''}
async function exportBackup(){const copy=structuredClone(state);copy.photos={};for(const n of [1,14,28,42,56,66]){const p=await idbGet('day-'+n);if(p)copy.photos[n]=p}const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`shy-reset-day-${state.currentDay}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importBackup(file){if(!file)return;try{const raw=JSON.parse(await file.text()),photos=raw.photos||{};delete raw.photos;state={...fresh(),...raw};Object.values(state.days).forEach(d=>migrateDay(d,state.randomSalt));for(const [n,p] of Object.entries(photos))await idbSet('day-'+n,p);localStorage.setItem(KEY,JSON.stringify(state));showToast('Backup imported.');render()}catch(e){showToast('That backup could not be imported.')}}
function copyFreebiePrompt(){const t='Find me current genuinely free online freebies, coupons, or perfume samples available in the U.S. right now. Prioritize perfume/beauty samples and useful freebies. Shipping must be free or no more than $3. Avoid trials that require a paid subscription or anything that requires a purchase. Give direct links and note any catches.';navigator.clipboard?.writeText(t);showToast('Freebie Hunt prompt copied.')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;render()});async function installApp(){if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;render()}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
state=load();
render();

</script>
